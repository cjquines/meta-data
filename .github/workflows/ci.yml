name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      - run: npm run build:data
      - run: npm run format
      - run: git diff --exit-code
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
